name: rijksdienst

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: rijksdienst
      POSTGRES_USER: rijksdienst
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rijksdienst -d rijksdienst"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: rijksdienst
      DB_USERNAME: rijksdienst
      DB_PASSWORD: ${DB_PASSWORD:-local-development-only}
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:24-bookworm-slim
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app
    environment:
      API_PROXY_TARGET: http://app:8000
    volumes:
      - ./frontend:/app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - app

volumes:
  postgres_data:
